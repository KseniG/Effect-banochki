:root{color-scheme:dark;--bg:#06070b;--fg:#f6f6f5;--lime:#b4ff60;--dim:#929994;--mono:ui-monospace,Consolas,monospace;background:var(--bg);color:var(--fg);font-family:Garet,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1px solid var(--lime);outline-offset:5px}
.installation{max-width:1500px;margin:auto;padding:0 clamp(12px,3vw,46px)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:54px;color:#a5aaa8;font:11px/1.35 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.scene-layout{--title-height:clamp(96px,11svh,112px);position:relative;display:grid;grid-template-rows:var(--title-height) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "stage"}
.title-slot{grid-area:title;display:grid;place-items:center;min-height:0;text-align:center;padding:5px 10px 14px}
.scene-layout .stage{grid-area:stage}
.stage{position:relative;isolation:isolate;width:100%;aspect-ratio:16/9;max-height:calc(100svh - 235px);min-height:285px;overflow:hidden;touch-action:manipulation}
.orbit{position:absolute;top:50%;left:50%;translate:-50% -50%;height:88%;aspect-ratio:1}
.ring,.plate{position:absolute;inset:0;width:100%;height:100%}
.ring{pointer-events:none;z-index:3;fill:none;stroke:var(--lime);stroke-width:4}
.ring circle{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .32s ease-out;vector-effect:non-scaling-stroke}
.stage[data-scene="1"] .ring{visibility:hidden}
.stage[data-scene="8"] .ring circle{stroke-dasharray:none;transition:none}
.plate{border-radius:50%;background:var(--bg);display:none}
.stage[data-scene="5"] .plate{display:block;box-shadow:0 0 40px 15px #06070b}
#glitch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.subject{position:absolute;z-index:1;left:50%;top:50%;translate:-50% -50%;width:100%;height:100%;object-fit:contain;pointer-events:none;transform:translate(var(--dx,0px),var(--dy,0px)) rotate(var(--tilt,0deg));transition:transform .19s ease-out;user-select:none}
.stage[data-scene="1"] .subject{width:91%;height:91%}
.stage[data-scene="4"] .subject{width:100%;height:100%}
.stage[data-scene="7"] .subject{width:91%;height:91%}
.water{display:none;position:absolute;z-index:2;inset:27% 0 0;background:#393377;opacity:.63;pointer-events:none}
.stage[data-scene="7"] .water{display:block}
.warning,.camera{position:absolute;width:31%;height:auto;left:50%;top:50%;translate:-50% -50%;z-index:2}
.warning{color:#fa0808}
.warning svg{display:block;width:100%;height:auto}
.camera{z-index:10;pointer-events:none}
.camera svg{display:block;width:100%;height:auto;fill:none;stroke:#f4f7ef;stroke-linecap:round;stroke-linejoin:round}
.camera-check{stroke:#c9ff91}
h1{max-width:100%;margin:0;text-align:center;font-size:clamp(29px,5.3vw,58px);font-weight:400;line-height:1.08;letter-spacing:-.025em;overflow-wrap:anywhere}

.materials{position:absolute;z-index:2;inset:18% 9%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:4% 1%;align-items:stretch;justify-items:stretch}
.material{grid-column:span 2;min-width:0;min-height:0;position:relative;display:grid;place-items:center;padding:0;border:0;background:none;color:#a5ff00;touch-action:manipulation}
.material:nth-child(4){grid-column:2/span 2}
.material:nth-child(5){grid-column:4/span 2}
.material[data-code="3"],.material[data-code="7"]{color:#ff0a08}
.material svg,.material img{position:absolute;inset:0;margin:auto;transition:opacity .28s ease;pointer-events:none}
.material svg{width:66%;max-height:72%;overflow:visible}
.material img{width:92%;height:92%;object-fit:contain;user-select:none;opacity:0}
.material[data-show-object="true"] svg{opacity:0}
.material[data-show-object="true"] img{opacity:1}
.information{max-width:740px;margin:0 auto;padding:7px 0 22px;text-align:center}
#hint{margin:0;min-height:18px;color:var(--dim);font-size:clamp(11px,1.2vw,14px);line-height:1.45}
.formula-panel{position:absolute;grid-area:stage;inset:0 auto 0 0;height:max-content;margin:auto 0;z-index:5;width:min(23%,230px);padding:12px 8px 12px 12px;border-left:1px solid #638337;background:#06070bee;text-align:left}
.formula-panel table,.formula-panel tbody{display:block}
.formula-panel caption{display:block;margin-bottom:8px;color:#acb1af;text-align:left;font:10px/1.35 var(--mono)}
.formula-panel thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.formula-panel tbody tr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 8px;align-items:baseline}
.formula-panel td{padding:0;line-height:1.25;overflow-wrap:anywhere;font-size:12px}
.formula-panel td:first-child{font:11px/1.25 var(--mono);color:#acb1af}
.formula-panel td:nth-child(3){grid-column:1/-1;font:clamp(18px,2vw,26px)/1.2 var(--mono);color:var(--lime)}
.formula-panel td:last-child{grid-column:1/-1;color:#acb1af}
.controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:13px;color:var(--dim);font:11px/1 var(--mono)}
.controls button{min-height:38px;padding:0 13px;border:1px solid #303638;border-radius:2px;background:none;color:#e9ece8}
.controls button:not(:disabled):hover{color:var(--lime);border-color:#657c4e}
.controls button:disabled{opacity:.28;cursor:default}
.cursor{display:none;position:fixed;left:0;top:0;z-index:20;width:20px;height:20px;border:1px solid #c9ff97b0;border-radius:50%;pointer-events:none;transform:translate(calc(var(--x,0px) - 50%),calc(var(--y,0px) - 50%)) scale(var(--pulse,1));transition:transform .12s ease-out}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tap-glow{position:fixed;z-index:19;inset:0;overflow:hidden;pointer-events:none}
.tap-glow span{position:absolute;width:clamp(190px,32vmin,340px);aspect-ratio:1;translate:-50% -50%;background:radial-gradient(circle,#edffafad 0%,#baff6785 18%,#8bff3f5e 34%,#78ff2926 53%,#78ff2900 72%);animation:tap-glow .64s ease-out both}
@keyframes tap-glow{0%{scale:.24;opacity:.95}24%{opacity:1}100%{scale:1.52;opacity:0}}
@media(max-width:650px){
  .formula-panel{grid-area:title;inset:0 auto auto 0;margin:0;width:100%;padding:7px 8px}
  .formula-panel caption{margin-bottom:4px}
  .formula-panel tbody tr{grid-template-columns:auto minmax(0,1fr) auto}
  .formula-panel td:nth-child(3){grid-column:3;font-size:clamp(14px,4vw,22px);white-space:nowrap}
  .formula-panel td:last-child{grid-column:2/-1}
}
@media(pointer:fine){.cursor.active{display:block}}

    <path d="M13 23 25 4a6 6 0 0 1 10 0l9 15m-10 0 12 3 2-12M48 27l8 15a6 6 0 0 1-5 9H34m5-8-8 8 8 5M26 51H9a6 6 0 0 1-5-9l8-14m-10 3 12-4 3 12" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="square" stroke-linejoin="round"/>
    <text x="30" y="36" fill="#fff" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="800">${code}</text></svg>`;
  $('warning').innerHTML = symbol(3);

  for (const item of ordered) {
    const row = document.createElement('tr');
    for (const value of [item.code,item.name,item.formula,item.example]) {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.append(cell);
    }
    $('formula-rows').append(row);
    rows.set(item.code,row);

    const button = document.createElement('button');
    button.className = 'material';
    button.type = 'button';
    button.dataset.code = item.code;
    button.setAttribute('aria-label', `${item.code} ${item.short} — ${item.example}`);
    button.innerHTML = symbol(item.code);
    const image = document.createElement('img');
    image.src = assets.objects[item.code];
    image.alt = '';
    image.draggable = false;
    button.append(image);
    button.addEventListener('pointerenter', event => {
      if (event.pointerType !== 'touch') select(item);
    });
    button.addEventListener('pointerleave', event => {
      if (event.pointerType !== 'touch' && !button.matches(':focus-visible') && material === item) select(null);
    });
    button.addEventListener('focus', () => {
      if (button.matches(':focus-visible')) select(item);
    });
    button.addEventListener('blur', () => {
      if (!button.matches(':hover') && material === item) select(null);
    });
    button.addEventListener('click', () => select(item));
    buttons.set(item.code,button);
    gallery.append(button);
  }

  function updateMaterials() {
    for (const [code,button] of buttons) {
      const showObject = stage.dataset.scene === '6-2' || code === material?.code;
      button.dataset.showObject = String(showObject);
    }
    for (const [code,row] of rows) row.hidden = code !== material?.code;
    $('formula-panel').hidden = gallery.hidden || !material;
    $('announcement').textContent = material ? `${material.name}. ${material.formula}. ${material.example}.` : '';
  }

  function makeSquares(item) {
    const target = item.red ? [245,0,0] : [159,245,0];
    return item.numbers.flatMap(number => {
      const ratio = number / maxNumber;
      const color = target.map(channel => Math.round(255+(channel-255)*ratio)).join(',');
      return Array.from({length:3}, () => ({
        x:Math.random(), y:Math.random(), size:4+ratio*76, age:0,
        lifetime:120*(1+number/10)*(1+item.rhythm),
        phase:Math.random()*Math.PI*2, speed:.05+Math.random()*.15, color,
      }));
    });
  }

  function select(item) {
    if (item === material) return;
    material = item;
    squares = item ? makeSquares(item) : [];
    updateMaterials();
    requestDraw();
  }

  function paint() {
    const scene = scenes[screen];
    const count = Math.max(1,scene.frames.length);
    const progress = Math.max(0, sceneOffsets[screen] + frame - progressStart) / progressSteps;
    stage.dataset.scene = scene.id;
    stage.style.setProperty('--water-top', scene.id === '7' ? `${[65,45,27][frame]}%` : '27%');
    stage.dataset.submerged = String(scene.id === '7' && frame === 2);
    $('screen-count').textContent = `${scene.id} / 8`;
    $('title').textContent = scene.title || '';
    $('title').hidden = !scene.title;
    $('arc').style.strokeDashoffset = String(100 * (1 - progress));
    $('warning').hidden = scene.id !== '5';
    $('camera').hidden = scene.id !== '8';
    gallery.hidden = !scene.id.startsWith('6');
    subject.hidden = !scene.frames.length;
    if (!subject.hidden) {
      subject.src = assets.renders[scene.frames[frame]];
      subject.alt = scene.alt;
    }
    $('hint').textContent = scene.hint || 'Коснись экрана или нажми клавишу для следующего кадра.';
    $('frame-count').textContent = count > 1 ? `${frame+1} / ${count} кадров` : '';
    $('back').disabled = screen === 0 && frame === 0;
    $('next').firstChild.textContent = scene.id === '8' ? 'Заново ' : 'Далее ';
    updateMaterials();
    requestDraw();
  }

  function enter(target, lastFrame = false) {
    screen = target;
    frame = lastFrame ? Math.max(0,scenes[screen].frames.length - 1) : 0;
    material = null;
    squares = [];
    paint();
  }

  function next() {
    if (frame+1 < scenes[screen].frames.length) {
      frame++;
      paint();
    } else enter((screen+1) % scenes.length);
  }

  $('next').addEventListener('click',next);
  $('back').addEventListener('click',() => {
    if (frame > 0) {
      frame--;
      paint();
    } else if (screen > 0) enter(screen-1,true);
  });
  stage.addEventListener('click',event => {
    if (!event.target.closest('button')) next();
  });
  addEventListener('keydown',event => {
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey ||
        ['Tab','Shift','Alt','Control','Meta','Escape','CapsLock'].includes(event.key)) return;
    if (event.target.closest?.('button') && ['Enter',' '].includes(event.key)) return;
    event.preventDefault();
    if (event.key === 'ArrowLeft') $('back').click();
    else next();
  });

  const cursor = $('cursor');
  const tapGlow = $('tap-glow');
  addEventListener('click', event => {
    if (motion.matches || event.detail === 0) return;
    const glow = document.createElement('span');
    glow.style.left = `${event.clientX}px`;
    glow.style.top = `${event.clientY}px`;
    glow.addEventListener('animationend', () => glow.remove(), {once:true});
    glow.addEventListener('animationcancel', () => glow.remove(), {once:true});
    tapGlow.append(glow);
  }, {passive:true});

  addEventListener('pointermove',event => {
    if (event.pointerType === 'touch' || motion.matches) return;
    cursor.classList.add('active');
    cursor.style.setProperty('--x',`${event.clientX}px`);
    cursor.style.setProperty('--y',`${event.clientY}px`);
    cursor.style.setProperty('--pulse',String(1+Math.min(.5,Math.hypot(event.movementX,event.movementY)/30)));
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(() => cursor.style.setProperty('--pulse','1'),95);
    const bounds = stage.getBoundingClientRect();
    const x = Math.max(-.5,Math.min(.5,(event.clientX-bounds.left)/bounds.width-.5));
    const y = Math.max(-.5,Math.min(.5,(event.clientY-bounds.top)/bounds.height-.5));
    subject.style.setProperty('--dx',`${x*44}px`);
    subject.style.setProperty('--dy',`${y*32}px`);
    subject.style.setProperty('--tilt',`${x*10}deg`);
  },{passive:true});
  document.documentElement.addEventListener('pointerleave',() => cursor.classList.remove('active'));

  function resize() {
    const ratio = Math.min(2,devicePixelRatio || 1);
    width = stage.clientWidth;
    height = stage.clientHeight;
    canvas.width = Math.max(1,Math.round(width*ratio));
    canvas.height = Math.max(1,Math.round(height*ratio));
    ctx.setTransform(ratio,0,0,ratio,0,0);
    requestDraw();
  }

  const granules = new Image();
  granules.onload = requestDraw;
  granules.src = assets.renders.granules;

  function requestDraw() {
    if (!scheduled) scheduled = requestAnimationFrame(draw);
  }

  function draw(now) {
    scheduled = 0;
    const delta = Math.min(2,(now-previous)/16.67 || 0);
    previous = now;
    ctx.clearRect(0,0,width,height);
    if (stage.dataset.scene === '5' && granules.complete && granules.naturalWidth) {
      const size = Math.max(width*1.5,height*3.1);
      ctx.drawImage(granules,(width-size)/2,(height-size)/2,size,size);
    }
    if (!material || gallery.hidden) return;
    if (!motion.matches) {
      squares = squares.filter(square => (square.age += delta) < square.lifetime);
      if (!squares.length) squares = makeSquares(material);
    }
    for (const square of squares) {
      const size = square.size * Math.min(1,width/650);
      const flicker = .7+.3*Math.sin(square.phase+square.age*square.speed);
      ctx.fillStyle = `rgba(${square.color},${flicker*.58})`;
      ctx.fillRect(square.x*(width-size),square.y*(height-size),size,size);
    }
    if (!motion.matches) requestDraw();
  }

  new ResizeObserver(resize).observe(stage);
  motion.addEventListener('change',requestDraw);
  paint();
  resize();
})();
</script>
</body>
</html>
